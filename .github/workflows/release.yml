name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: make workflow
      - name: Create release
        run: gh release create "$GITHUB_REF_NAME" letterboxd.alfredworkflow --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
